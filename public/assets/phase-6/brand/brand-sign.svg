<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title description">
  <title id="title">La Grange</title>
  <desc id="description">Enseigne rustique en bois suspendue par une corde, avec le sous-titre Mon atelier de projets.</desc>
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b3820"/>
      <stop offset="0.5" stop-color="#3a2417"/>
      <stop offset="1" stop-color="#24150e"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a755b"/>
      <stop offset="0.45" stop-color="#4c4033"/>
      <stop offset="1" stop-color="#211b17"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="textShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#160d08" flood-opacity="0.9"/>
    </filter>
  </defs>

  <g fill="none" stroke-linecap="round">
    <path d="M82 108C174 28 625 28 718 108" stroke="#6d4727" stroke-width="22"/>
    <path d="M82 108C174 28 625 28 718 108" stroke="#bd8750" stroke-width="5" stroke-dasharray="5 14" opacity="0.7"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M58 92Q400 72 742 92L730 308Q400 328 70 308Z" fill="url(#wood)" stroke="#160d08" stroke-width="18"/>
    <path d="M78 111Q400 94 722 111L712 289Q400 307 88 289Z" fill="none" stroke="#a27645" stroke-width="5" opacity="0.8"/>
    <path d="M102 142C230 122 334 149 463 129S641 130 695 124" fill="none" stroke="#8d5e35" stroke-width="5" opacity="0.28"/>
    <path d="M100 252C228 233 347 259 472 240S627 244 694 232" fill="none" stroke="#1a0f0a" stroke-width="6" opacity="0.38"/>
    <path d="M126 116V288M267 103V302M534 103V302M674 116V288" stroke="#21130c" stroke-width="7" opacity="0.35"/>
  </g>

  <g fill="url(#metal)" stroke="#130d09" stroke-width="4">
    <circle cx="94" cy="126" r="13"/><circle cx="706" cy="126" r="13"/>
    <circle cx="105" cy="278" r="13"/><circle cx="695" cy="278" r="13"/>
  </g>
  <g stroke="#1b140f" stroke-width="4" stroke-linecap="round">
    <path d="M87 126H101M94 119V133M699 126H713M706 119V133"/>
    <path d="M98 278H112M105 271V285M688 278H702M695 271V285"/>
  </g>

  <g text-anchor="middle" filter="url(#textShadow)">
    <text x="400" y="215" fill="#f4e3bf" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="700" letter-spacing="7">LA GRANGE</text>
    <text x="400" y="265" fill="#ddc59c" font-family="system-ui, sans-serif" font-size="27" letter-spacing="2">Mon atelier de projets</text>
  </g>
</svg>
