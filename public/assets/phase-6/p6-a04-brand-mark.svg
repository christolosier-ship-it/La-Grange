<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
<title id="title">Symbole La Grange</title>
<desc id="desc">Médaillon de bois cerclé de corde avec le monogramme LG doré.</desc>
<defs>
  <radialGradient id="wood" cx="38%" cy="30%" r="72%">
    <stop offset="0" stop-color="#8f5527"/>
    <stop offset=".58" stop-color="#5d3218"/>
    <stop offset="1" stop-color="#2d170d"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffe3a1"/>
    <stop offset=".48" stop-color="#d7a54f"/>
    <stop offset="1" stop-color="#8c5a1f"/>
  </linearGradient>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#120904" flood-opacity=".65"/>
  </filter>
</defs>

<!-- corde extérieure -->
<circle cx="128" cy="128" r="112" fill="none" stroke="#8a5529" stroke-width="15"/>
<circle cx="128" cy="128" r="112" fill="none" stroke="#c18a48" stroke-width="4"
        stroke-dasharray="7 8" stroke-linecap="round" opacity=".72"/>

<!-- médaillon en bois -->
<circle cx="128" cy="128" r="96" fill="url(#wood)" stroke="#2b160c" stroke-width="6" filter="url(#shadow)"/>
<path d="M48 91c45-17 112-15 160 2M43 125c49-14 122-13 170 1M48 160c44-12 110-10 160 3"
      fill="none" stroke="#b57a3d" stroke-width="3" opacity=".34" stroke-linecap="round"/>
<path d="M57 76c36 8 99 4 142-5M54 145c42 10 103 8 149-2M64 183c35 6 91 5 128-1"
      fill="none" stroke="#28130a" stroke-width="2.5" opacity=".55" stroke-linecap="round"/>

<!-- quatre clous, rappel de l’enseigne -->
<g fill="#5a3924" stroke="#1d1009" stroke-width="2">
  <circle cx="70" cy="70" r="7"/><circle cx="186" cy="70" r="7"/>
  <circle cx="70" cy="186" r="7"/><circle cx="186" cy="186" r="7"/>
</g>
<g fill="#b07a47" opacity=".45">
  <circle cx="68" cy="68" r="2.4"/><circle cx="184" cy="68" r="2.4"/>
  <circle cx="68" cy="184" r="2.4"/><circle cx="184" cy="184" r="2.4"/>
</g>

<!-- monogramme -->
