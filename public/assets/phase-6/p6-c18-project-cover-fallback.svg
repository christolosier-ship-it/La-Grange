<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Cadre générique de couverture de projet</title>
  <desc id="desc">Plaque sombre sertie dans un cadre de bois et de métal, sans texte ni information fonctionnelle.</desc>
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f4726"/>
      <stop offset="0.45" stop-color="#3e2617"/>
      <stop offset="1" stop-color="#24160f"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c7469"/>
      <stop offset="0.5" stop-color="#3d3934"/>
      <stop offset="1" stop-color="#171513"/>
    </linearGradient>
    <radialGradient id="panel" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#2f2a25"/>
      <stop offset="0.58" stop-color="#1b1816"/>
      <stop offset="1" stop-color="#0d0c0b"/>
    </radialGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d69a32" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d69a32" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#d69a32" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grain" width="48" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 8c12-7 25-7 48 0M0 18c17-6 31-6 48 0" fill="none" stroke="#d1a060" stroke-opacity="0.11" stroke-width="1.5"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <path d="M38 54 73 22h494l35 32v292l-35 32H73l-35-32Z" fill="url(#wood)" stroke="#17100b" stroke-width="10" stroke-linejoin="round"/>
    <path d="M38 54 73 22h494l35 32v292l-35 32H73l-35-32Z" fill="url(#grain)" opacity="0.9"/>
    <path d="M70 70 94 48h452l24 22v260l-24 22H94l-24-22Z" fill="none" stroke="url(#metal)" stroke-width="18" stroke-linejoin="round"/>
    <path d="M92 86h456v228H92Z" fill="url(#panel)" stroke="#0a0908" stroke-width="6"/>
    <path d="M116 110h408v180H116Z" fill="none" stroke="#8f6735" stroke-opacity="0.36" stroke-width="2"/>
    <path d="M118 116h404" stroke="url(#glow)" stroke-width="4" stroke-linecap="round"/>
    <path d="M118 284h404" stroke="#000" stroke-opacity="0.52" stroke-width="3" stroke-linecap="round"/>

    <g fill="url(#metal)" stroke="#151311" stroke-width="3">
      <circle cx="78" cy="62" r="12"/><circle cx="562" cy="62" r="12"/>
      <circle cx="78" cy="338" r="12"/><circle cx="562" cy="338" r="12"/>
    </g>
    <g stroke="#b0a698" stroke-opacity="0.58" stroke-width="2" stroke-linecap="round">
      <path d="m72 56 12 12m0-12L72 68"/><path d="m556 56 12 12m0-12-12 12"/>
      <path d="m72 332 12 12m0-12-12 12"/><path d="m556 332 12 12m0-12-12 12"/>
    </g>

    <path d="M122 90 96 116v168l26 26" fill="none" stroke="#d69a32" stroke-opacity="0.17" stroke-width="3"/>
    <path d="m518 90 26 26v168l-26 26" fill="none" stroke="#d69a32" stroke-opacity="0.17" stroke-width="3"/>
  </g>
</svg>
