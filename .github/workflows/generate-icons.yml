name: Generate PWA icons
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  icons:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Write PNG icons
        shell: bash
        run: |
          mkdir -p public/icons
          echo '' | base64 --decode > public/icons/icon-192.png
          echo '' | base64 --decode > public/icons/icon-512.png
          echo '' | base64 --decode > public/icons/maskable-512.png
          echo '' | base64 --decode > public/icons/apple-touch-icon.png
      - name: Commit icons when changed
        run: |
          if git diff --quiet -- public/icons && git ls-files --error-unmatch public/icons/icon-192.png >/dev/null 2>&1; then
            echo "PWA icons are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/icons
          git commit -m "fix(pwa): ajouter les icônes PNG installables"
          git push
