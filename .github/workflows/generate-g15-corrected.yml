name: Generate corrected G15 boards

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/generate-g15-corrected.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/phase-6a-visual-integration

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Start preview server
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/la-grange-vite.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/La-Grange/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/la-grange-vite.log
          exit 1

      - name: Validate shell and capture G15 boards
        run: |
          mkdir -p artifacts/g15
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';

          const baseUrl = 'http://127.0.0.1:4173/La-Grange/';
          const captures = [
            ['p6-g15a-shell-desktop-1440x1024.png', 1440, 1024, 'p6-b01-background-workshop-2048x1152.webp'],
            ['p6-g15b-shell-tablet-1024x1366.png', 1024, 1366, 'p6-b03-background-workshop-tablet-1024x1366.webp'],
            ['p6-g15c-shell-mobile-390x844.png', 390, 844, 'p6-b04-background-workshop-mobile-780x1386.webp'],
          ];

          const browser = await chromium.launch({ headless: true });
          try {
            for (const [name, width, height, expectedBackground] of captures) {
              const context = await browser.newContext({
                viewport: { width, height },
                deviceScaleFactor: 1,
                locale: 'fr-FR',
                colorScheme: 'dark',
              });
              const page = await context.newPage();
              await page.goto(`${baseUrl}#/`, { waitUntil: 'networkidle' });
              await page.waitForSelector('.app-shell', { state: 'visible' });

              const result = await page.evaluate(() => {
                const background = document.querySelector('.phase-6-scene__background img');
                const light = document.querySelector('.phase-6-scene__light');
                const scene = document.querySelector('.phase-6-scene');
                const nav = document.querySelector('.primary-nav');
                const navIcons = [...document.querySelectorAll('.primary-nav__icon')];
                const statusIcon = document.querySelector('.workbench-note__icon');
                const syncButton = document.querySelector('.sync-button');
                const sceneBox = scene?.getBoundingClientRect();
                const navBox = nav?.getBoundingClientRect();
                const syncPseudo = syncButton ? getComputedStyle(syncButton, '::before') : null;

                return {
                  backgroundSrc: background instanceof HTMLImageElement ? background.currentSrc : '',
                  backgroundLoaded: background instanceof HTMLImageElement && background.complete && background.naturalWidth > 0,
                  lightLoaded: light instanceof HTMLImageElement && light.complete && light.naturalWidth > 0,
                  scenePosition: scene ? getComputedStyle(scene).position : '',
                  sceneBox: sceneBox ? { x: sceneBox.x, y: sceneBox.y, width: sceneBox.width, height: sceneBox.height } : null,
                  objectFit: background ? getComputedStyle(background).objectFit : '',
                  navBackground: nav ? getComputedStyle(nav).backgroundImage : '',
                  navPosition: nav ? getComputedStyle(nav).position : '',
                  navBox: navBox ? { x: navBox.x, y: navBox.y, width: navBox.width, height: navBox.height } : null,
                  navIconsVisible: navIcons.length === 4 && navIcons.every((icon) =>
                    icon instanceof HTMLImageElement
                    && icon.complete
                    && icon.naturalWidth > 0
                    && icon.getBoundingClientRect().width >= 16
                    && icon.getBoundingClientRect().height >= 16
                  ),
                  statusIconVisible: statusIcon instanceof HTMLImageElement
                    && statusIcon.complete
                    && statusIcon.naturalWidth > 0
                    && statusIcon.getBoundingClientRect().width > 0,
                  syncMask: syncPseudo?.maskImage || syncPseudo?.webkitMaskImage || '',
                };
              });

              if (!result.backgroundSrc.includes(expectedBackground)) throw new Error(`Fond inattendu pour ${name}: ${result.backgroundSrc}`);
              if (!result.backgroundLoaded || !result.lightLoaded) throw new Error(`Fond ou B12 non chargé pour ${name}`);
              if (result.scenePosition !== 'fixed' || !result.sceneBox) throw new Error(`Scène non fixe pour ${name}`);
              if (Math.round(result.sceneBox.width) !== width || Math.round(result.sceneBox.height) !== height) throw new Error(`Scène hors viewport pour ${name}`);
              if (result.objectFit !== 'contain') throw new Error(`Le fond ne reste pas entier pour ${name}`);
              if (!result.navBackground.includes('p6-b07-texture-wood-structure-1024x1024.webp')) throw new Error(`B07 absent pour ${name}`);
              if (!result.navIconsVisible || !result.statusIconVisible) throw new Error(`Icônes invisibles pour ${name}`);
              if (!result.syncMask.includes('p6-d05-icon-sync.svg')) throw new Error(`D05 absent pour ${name}`);
              if (width < 720) {
                if (result.navPosition !== 'fixed' || !result.navBox) throw new Error(`Navigation mobile non fixe pour ${name}`);
                if (Math.round(result.navBox.y + result.navBox.height) !== height) throw new Error(`Navigation mobile hors écran pour ${name}`);
              }

              const beforeRoute = await page.locator('.phase-6-scene').boundingBox();
              await page.goto(`${baseUrl}#/projects`, { waitUntil: 'networkidle' });
              const afterRoute = await page.locator('.phase-6-scene').boundingBox();
              if (JSON.stringify(beforeRoute) !== JSON.stringify(afterRoute)) throw new Error(`Scène instable entre menus pour ${name}`);

              await page.goto(`${baseUrl}#/`, { waitUntil: 'networkidle' });
              await page.screenshot({ path: `artifacts/g15/${name}`, fullPage: false });
              await context.close();
            }

            const context = await browser.newContext({ viewport: { width: 1366, height: 1024 }, deviceScaleFactor: 1 });
            const page = await context.newPage();
            await page.goto(`${baseUrl}#/`, { waitUntil: 'networkidle' });
            const src = await page.locator('.phase-6-scene__background img').evaluate((image) =>
              image instanceof HTMLImageElement ? image.currentSrc : '',
            );
            if (!src.includes('p6-b02-background-workshop-tablet-1366x1024.webp')) throw new Error(`B02 non sélectionné: ${src}`);
            await context.close();
          } finally {
            await browser.close();
          }
          EOF

      - name: Upload corrected G15 boards
        uses: actions/upload-artifact@v4
        with:
          name: corrected-g15-boards-${{ github.run_attempt }}
          path: artifacts/g15/*.png
          if-no-files-found: error
